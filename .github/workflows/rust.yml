name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test-integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run integration tests with coverage
        run: cargo llvm-cov nextest --no-report --no-fail-fast -E 'binary(integration)'

      # Only upload the inputs `cargo llvm-cov report` actually needs: the
      # .profraw files and the instrumented executables. See the script for
      # why it searches rather than globbing a fixed directory.
      - name: Stage coverage data
        run: .github/scripts/stage-coverage.sh coverage-staging

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-integration
          path: coverage-staging/
          if-no-files-found: error

  test-unit:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run unit tests with coverage
        run: cargo llvm-cov nextest --no-report --no-fail-fast -E 'not binary(integration)'

      - name: Stage coverage data
        run: .github/scripts/stage-coverage.sh coverage-staging

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-unit
          path: coverage-staging/
          if-no-files-found: error

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Download unit coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data-unit
          path: coverage-staging/unit/

      - name: Download integration coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data-integration
          path: coverage-staging/integration/

      # Each artifact contains only .profraw files and the instrumented
      # executables, at their paths under target/llvm-cov-target/. Profraws
      # have unique names per test run so they accumulate; executables are
      # built identically in both jobs, so an overwrite replaces a binary
      # with the same one.
      - name: Combine coverage data
        run: |
          mkdir -p target/llvm-cov-target
          cp -a coverage-staging/unit/. target/llvm-cov-target/
          cp -a coverage-staging/integration/. target/llvm-cov-target/
          rm -rf coverage-staging
          # actions/upload-artifact strips Unix permissions, so the test
          # binaries arrive non-executable and cargo-llvm-cov skips them
          # when collecting object files. Restore +x.
          find target/llvm-cov-target/debug -type f -exec chmod +x {} +
          echo "profraw files merged: $(find target/llvm-cov-target -name '*.profraw' | wc -l)"
          echo "executables merged:"
          find target/llvm-cov-target/debug -type f -exec ls -l {} +

      - name: Generate coverage report
        run: |
          cargo llvm-cov report --color=always --ignore-filename-regex 'tests/'
          cargo llvm-cov report --html --ignore-filename-regex 'tests/'

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            target/llvm-cov/html/
