[settings]
lockfile = true

[tools]
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-release" = "latest"
"github:axodotdev/cargo-dist" = { version = "0.31", exe = "dist" }
gh = "latest"
git-cliff = "latest"

[tasks.test]
description = "Run the full test suite (unit + integration)"
env = { CLICOLOR = "1" }
run = '''cargo nextest run --no-fail-fast "$@"'''

[tasks.test-unit]
description = "Run unit tests only (excludes the integration binary)"
env = { CLICOLOR = "1" }
run = '''cargo nextest run --no-fail-fast -E 'not binary(integration)' "$@"'''

[tasks.test-int]
description = "Run integration tests only (spawns real flock processes)"
env = { CLICOLOR = "1" }
run = '''cargo nextest run --no-fail-fast -E 'binary(integration)' "$@"'''

[tasks.test-linux]
description = """
Run the test suite on Linux in Docker (/bin/sh is dash)

Reproduces the CI environment on a mac: the container is Debian-based, so
`/bin/sh` is dash, not bash. That matters here because the descriptor-mode
tests drive real shells, and dash enforces the POSIX rule that redirections
only name fds 0-9 (`exec 10<>f` is an error there, fine under macOS's bash).

Build and run are separate docker commands: `Dockerfile.test` compiles the
test binaries (cargo-chef for the dependency layer, sccache on a cache mount
for everything else), then `docker run` only executes them. The host
`target/` is never touched. Runs on the host architecture, not forced to
CI's x86_64.

Extra args go to `cargo nextest run`, e.g.
`mise run test-linux -- -E 'binary(fd_weighted)'`.
"""
run = '''
set -eu
docker build -f Dockerfile.test -t flock-linux-test .
exec docker run --rm -t -e CLICOLOR=1 flock-linux-test \
  cargo nextest run --no-fail-fast "$@"
'''

[tasks.cov-unit]
description = """
Coverage of all unit tests (no integration).
"""
env = { CLICOLOR = "1" }
run = """
cargo llvm-cov nextest --no-fail-fast --ignore-filename-regex 'tests/' -E 'not binary(integration)'
cargo llvm-cov report --color=always
cargo llvm-cov report --html
"""

[tasks.cov-all]
description = """
Coverage of unit + integration tests.
"""
env = { CLICOLOR = "1" }
run = '''
cargo llvm-cov nextest --no-fail-fast --show-missing-lines --ignore-filename-regex 'tests/'
cargo llvm-cov report --color=always
cargo llvm-cov report --html
'''
